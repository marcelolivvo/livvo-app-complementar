<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="livvoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3EE7EE" />
      <stop offset="50%" stop-color="#33DFE5" />
      <stop offset="100%" stop-color="#20D2D9" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Cyan Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="122" fill="url(#livvoCyanGrad)" filter="url(#badgeShadow)" />

  <!-- 3D LIVVO Typography -->
  <g transform="translate(0, 0)">
    <!-- 3D Black Extrusion (Layers down-right) -->
    <!-- Layer 12 -->
    <text x="256" y="302" text-anchor="middle" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-size="114" font-weight="900" letter-spacing="-1.5" fill="#000000" stroke="#000000" stroke-width="20" stroke-linejoin="round" stroke-linecap="round">LIVVO</text>
    <!-- Layer 10 -->
    <text x="254" y="300" text-anchor="middle" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-size="114" font-weight="900" letter-spacing="-1.5" fill="#000000" stroke="#000000" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">LIVVO</text>
    <!-- Layer 8 -->
    <text x="252" y="298" text-anchor="middle" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-size="114" font-weight="900" letter-spacing="-1.5" fill="#000000" stroke="#000000" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">LIVVO</text>
    <!-- Layer 6 -->
    <text x="250" y="296" text-anchor="middle" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-size="114" font-weight="900" letter-spacing="-1.5" fill="#000000" stroke="#000000" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">LIVVO</text>
    <!-- Layer 4 -->
    <text x="248" y="294" text-anchor="middle" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-size="114" font-weight="900" letter-spacing="-1.5" fill="#000000" stroke="#000000" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">LIVVO</text>
    <!-- Layer 2 -->
    <text x="246" y="292" text-anchor="middle" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-size="114" font-weight="900" letter-spacing="-1.5" fill="#000000" stroke="#000000" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">LIVVO</text>

    <!-- Front Black Outline -->
    <text x="244" y="290" text-anchor="middle" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-size="114" font-weight="900" letter-spacing="-1.5" fill="#000000" stroke="#000000" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">LIVVO</text>

    <!-- Front Off-White/Cream Letter Face -->
    <text x="244" y="290" text-anchor="middle" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-size="114" font-weight="900" letter-spacing="-1.5" fill="#EDE7DE">LIVVO</text>
  </g>
</svg>
